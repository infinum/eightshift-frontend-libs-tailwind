[fmt]
useTabs = true
jsxSingleQuote = true
singleQuote = true
singleAttributePerLine = true
printWidth = 300
arrowParens = "always"
bracketSpacing = true
semi = true
trailingComma = "all"
sortImports = false
sortPackageJson = false
svelte = false
sortTailwindcss = true
ignorePatterns = ["test/**", "tests/**", "package/**", "public/**", "vendor/**", "vendor-prefixed/**", "**/dist/**", ".release-validation-temp/**"]
